name: Mirror Opening Bell Submission Method

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-opening-bell-submission.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PFM module to use working Opening Bell GET receiver
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('modules/pfm-financial-planning-goal-setting-mrd.html')
          s = p.read_text()

          endpoint = 'https://script.google.com/macros/s/AKfycbw4kLfppzaPH0LJnYnijygKpqSN11gme9JHpgOt4_R-ReiA-cHFi53kde4hK3kl0y4/exec'
          s = re.sub(r'const COMPLETION_WEB_APP_URL = "[^"]+";', f'const COMPLETION_WEB_APP_URL = "{endpoint}";', s, count=1)

          old_pattern = re.compile(r'function submitCompletionRecord\(record\)\{.*?\n\}', re.S)
          new_func = '''function submitCompletionRecord(record){
  if(completionSubmitted){
    toast("Completion already submitted.");
    return;
  }

  completionSubmitted = true;
  toast("Saving completion...");

  const p = new URLSearchParams({
    bellId: "PFM-GOAL-SETTING",
    label: "Vivid PFM Goal Setting",
    firstName: record.firstName || "",
    lastName: record.lastName || "",
    name: ((record.firstName||"")+" "+(record.lastName||"")).trim(),
    answer: JSON.stringify({
      score: record.score,
      totalQuestions: record.totalQuestions,
      percent: record.percent,
      reflection: record.reflection,
      version: record.version,
      questionTypes: record.questionTypes,
      answers: record.answers,
      sessionId: record.sessionId,
      timeStarted: record.timeStarted,
      timeFinished: record.timeFinished
    }),
    late: "0",
    duration: String(record.totalTime || "").replace(/[^0-9]/g, "") || "1",
    timestamp: record.timestamp || new Date().toISOString(),
    cls: "PFM - " + (record.classPeriod || "")
  });

  fetch(`${COMPLETION_WEB_APP_URL}?${p.toString()}`,{
    method:"GET",
    mode:"no-cors"
  })
  .then(()=>{
    toast("Completion saved to Google Sheets.");
  })
  .catch(error=>{
    completionSubmitted = false;
    console.error("Completion submit error:", error);
    toast("Certificate created, but completion did not save. Tell your teacher.");
  });
}'''

          if not old_pattern.search(s):
              raise SystemExit('Could not locate submitCompletionRecord function')
          s = old_pattern.sub(new_func, s, count=1)
          p.write_text(s)
          PY
      - name: Commit connection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/pfm-financial-planning-goal-setting-mrd.html
          if git diff --cached --quiet; then
            echo 'Already patched.'
          else
            git commit -m 'Mirror Opening Bell submission method for PFM module'
            git push
          fi
