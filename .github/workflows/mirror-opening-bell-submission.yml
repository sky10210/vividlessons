name: Mirror Opening Bell Submission Method

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-opening-bell-submission.yml'
      - '.github/scripts/patch_opening_bell_submission.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PFM module
        run: python .github/scripts/patch_opening_bell_submission.py
      - name: Commit connection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/pfm-financial-planning-goal-setting-mrd.html
          if git diff --cached --quiet; then
            echo 'Already patched.'
          else
            git commit -m 'Mirror Opening Bell submission method for PFM module'
            git push
          fi
