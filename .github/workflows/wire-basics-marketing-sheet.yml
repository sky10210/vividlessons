name: Wire Basics of Marketing Sheet

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-basics-marketing-sheet.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch marketing module
        run: |
          python -c "from pathlib import Path; import re,base64; p=Path('modules/marketing-basics-intro-mrd.html'); s=p.read_text(); endpoint='https://script.google.com/macros/s/AKfycbw4kLfppzaPH0LJnYnijygKpqSN11gme9JHpgOt4_R-ReiA-cHFi53kde4hK3kl0y4/exec'; s=re.sub(r'const COMPLETION_WEB_APP_URL = \\\"[^\\\"]+\\\";', 'const COMPLETION_WEB_APP_URL = \\\"'+endpoint+'\\\";', s, count=1); new=base64.b64decode('').decode(); s=re.sub(r'function submitCompletionRecord\\(record\\)\\{.*?\\n\\}\\n\\nrestoreCompletionLockIfNeeded\\(\\);', new+'\\n\\nrestoreCompletionLockIfNeeded();', s, count=1, flags=re.S); p.write_text(s)"
      - name: Commit module change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/marketing-basics-intro-mrd.html
          git commit -m 'Wire Basics of Marketing to Opening Bell workbook' || exit 0
          git push
