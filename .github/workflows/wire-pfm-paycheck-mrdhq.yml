name: Wire PFM Paycheck to MRDHQ Responses

on:
  push:
    paths:
      - '.github/workflows/wire-pfm-paycheck-mrdhq.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch paycheck module
        run: python .github/scripts/wire_pfm_paycheck.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/pfm-your-first-paycheck.html
          git commit -m "Route PFM paycheck results to MRDHQ Responses"
          git push
