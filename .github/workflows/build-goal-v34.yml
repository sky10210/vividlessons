name: Build Goal Setting v3.4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-goal-v34.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble enhanced classroom module
        run: |
          cat .v34-parts/part1 .v34-parts/part2 .v34-parts/part3 .v34-parts/part4 | base64 -d | gzip -d > modules/pfm-financial-planning-goal-setting-mrd.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/pfm-financial-planning-goal-setting-mrd.html
          git rm -r .v34-parts
          git rm .github/workflows/build-goal-v34.yml
          git commit -m "Build harder 20-question PFM goal setting module v3.4"
          git push
