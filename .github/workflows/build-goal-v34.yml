name: Build Goal Setting v3.4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-goal-v34.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify enhanced classroom module
        run: |
          cat .v34-parts/p1a .v34-parts/p1b .v34-parts/p2a .v34-parts/p2b .v34-parts/part3 .v34-parts/part4 > /tmp/wrapper.b64
          echo "e0b56281677d74ac5b7235126e7b56c64f67a2915eac8abbcaafb60a2b4de6f6  /tmp/wrapper.b64" | sha256sum -c -
          base64 -d /tmp/wrapper.b64 | gzip -d > modules/pfm-financial-planning-goal-setting-mrd.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/pfm-financial-planning-goal-setting-mrd.html
          git rm -r .v34-parts
          git rm .github/workflows/build-goal-v34.yml .github/workflows/check-goal-v34-parts.yml
          git commit -m "Build harder 20-question PFM goal setting module v3.4"
          git push
