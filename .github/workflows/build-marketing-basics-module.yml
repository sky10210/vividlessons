name: Build Marketing Basics Module
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-marketing-basics-module.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build module from canonical Vivid Lessons template
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          src = Path('modules/pfm-financial-planning-goal-setting-mrd.html')
          dst = Path('modules/marketing-basics-intro-mrd.html')
          text = src.read_text(encoding='utf-8')

          meta = '''const MODULE_META = {
            id: "marketing-basics-intro",
            title: "Basics of Marketing Interactive Lesson",
            category: "Marketing",
            topic: "Marketing Fundamentals",
            productType: "Interactive Module",
            moduleSize: "extended",
            shortDescription: "Students build a practical foundation in customer-focused marketing, segmentation, value propositions, the 4 Ps, branding, competition, customer experience, and ethics.",
            questionCount: 20,
            sectionCount: 21,
            primaryQuestionTypes: ["Scenario-Based", "Multiple Choice", "Matching", "Sorting"],
            tags: ["Marketing Basics", "Target Market", "Segmentation", "4 Ps", "Branding", "Marketing Ethics", "Auto-Scored"],
            reflectionRequired: true,
            certificateIncluded: true,
            completionTracking: true,
            autoScored: true,
            previewUrl: "",
            launchUrl: "../teacher-dashboard.html",
            shopifyUrl: "",
            version: "1.0"
          };'''
          text = re.sub(r'const MODULE_META = \{.*?\n\};', meta, text, count=1, flags=re.S)

          QUESTIONS = [
          {"n":1,"title":"Marketing Is More Than Advertising","subtitle":"Separate marketing from one promotional tactic.","lesson":"Marketing is the process of creating, communicating, delivering, and exchanging offerings that have value for customers. Advertising is only one part of promotion, and promotion is only one part of marketing.","callout":"Key idea: Marketing starts with understanding customers—not with making an ad.","type":"scenario","prompt":"A new smoothie shop is deciding what flavors to offer, what prices students will accept, where to sell, and how to promote the launch. Which statement best describes what the shop is doing?","options":["Only advertising, because promotion determines whether customers notice the shop.","Marketing, because it is making coordinated decisions about customers, value, product, price, place, and promotion.","Selling, because the main goal is to convince people to buy after the product is already created.","Branding only, because choosing flavors and prices mainly determines the shop’s visual identity."],"correct":1,"feedbackGood":"Correct. Marketing coordinates decisions about customers and value across the whole offer—not just advertising.","feedbackBad":"Look for the choice that includes understanding customers and coordinating more than one business decision."},
          {"n":2,"title":"Needs, Wants, and Demand","subtitle":"Distinguish what people require from how they prefer to satisfy it.","lesson":"A need is a basic state of felt deprivation, such as hunger, transportation, or belonging. A want is the specific form a need takes based on culture, personality, and preferences. Demand exists when customers want something and have the ability and willingness to buy it.","callout":"Need = underlying problem. Want = preferred solution. Demand = want + ability/willingness to pay.","type":"matching","prompt":"Match each example to the marketing idea it best represents.","pairs":[{"term":"A student needs transportation to a job","key":"need","definition":"Need"},{"term":"The student prefers a used Honda Civic","key":"want","definition":"Want"},{"term":"The student has $8,000 saved and is shopping for that car","key":"demand","definition":"Demand"}]},
          {"n":3,"title":"Customer Value","subtitle":"Identify why a customer chooses one offer over another.","lesson":"Customer value is the customer's judgment of the benefits received compared with the costs or sacrifices required. Those costs can include money, time, effort, inconvenience, and risk.","callout":"Value is not the same as cheap. A higher-priced option can create more value if the benefits matter enough.","type":"scenario","prompt":"Two meal-prep services cost $8 and $11 per meal. The $11 service delivers on time, offers athlete-sized portions, and lets customers skip weeks easily. For a busy athlete, why might the $11 service create more value?","options":["Because higher prices automatically signal higher quality to every customer.","Because value compares meaningful benefits with the money, time, and effort required.","Because customers should ignore price whenever a product has more features.","Because the lower-priced service cannot create value if another option costs more."],"correct":1,"feedbackGood":"Correct. Value depends on the benefits that matter to the target customer relative to total cost and sacrifice.","feedbackBad":"Think benefits versus total sacrifice—not simply high price versus low price."},
          {"n":4,"title":"The Target Market","subtitle":"Choose a specific group rather than everyone.","lesson":"A target market is the specific group of customers a business chooses to serve. Strong targeting helps a company design a more relevant product, message, price, and buying experience.","callout":"If your target is everyone, your marketing decisions usually become too vague.","type":"scenario","prompt":"A company sells durable, customizable water bottles that fit bicycle cages and includes a replacement-lid program. Which target market is strongest?","options":["Everyone who drinks water, because nearly all people could use a bottle.","People ages 10–70, because a larger age range always creates a stronger target market.","Recreational and competitive cyclists who regularly carry water on rides and value durable gear.","Anyone who follows fitness accounts online, whether or not they ride bikes or buy reusable bottles."],"correct":2,"feedbackGood":"Correct. It identifies a specific group whose behavior and needs fit the offer.","feedbackBad":"Choose the group that is both specific and strongly connected to the product's benefits."},
          {"n":5,"title":"Market Segmentation","subtitle":"Classify customers using four common segmentation bases.","lesson":"Marketers divide broad markets into smaller segments. Demographic segmentation uses measurable population traits. Geographic uses location. Psychographic uses lifestyle, interests, and values. Behavioral uses actions such as usage, loyalty, benefits sought, or purchase behavior.","callout":"Four common bases: demographic, geographic, psychographic, behavioral.","type":"matching","prompt":"Match each example to the segmentation base it represents.","pairs":[{"term":"College students ages 18–22","key":"demo","definition":"Demographic"},{"term":"Customers living within 10 miles of Chambersburg","key":"geo","definition":"Geographic"},{"term":"People who value sustainability and outdoor adventure","key":"psycho","definition":"Psychographic"},{"term":"Customers who buy iced coffee at least four times a week","key":"behavior","definition":"Behavioral"}]},
          {"n":6,"title":"Customer Problems and Jobs","subtitle":"Look beneath the product to what the customer is trying to accomplish.","lesson":"Customers do not simply buy products; they use products and services to solve problems, satisfy wants, reduce friction, or accomplish a job. Understanding that job can reveal better opportunities.","callout":"Ask: What is the customer really trying to get done?","type":"scenario","prompt":"Students complain that the cafeteria line takes 18 minutes. Which interpretation is most useful to a marketer?","options":["Students mainly need more menu choices, because longer menus make waiting feel more worthwhile.","The core opportunity may be reducing the time and uncertainty involved in getting food during a limited lunch period.","The cafeteria should advertise more heavily so students understand that waiting is normal.","The problem is only price, because every customer complaint can ultimately be solved with a discount."],"correct":1,"feedbackGood":"Correct. The complaint reveals a job: get food reliably within a limited amount of time.","feedbackBad":"Focus on the underlying customer problem revealed by the complaint."},
          {"n":7,"title":"A Strong Value Proposition","subtitle":"Explain clearly why the target customer should care.","lesson":"A value proposition explains the meaningful benefit a business promises a target customer and why the offer is a strong choice compared with alternatives. It should be specific enough to matter.","callout":"Strong value proposition = target customer + meaningful benefit + reason to choose.","type":"multiple-choice","prompt":"Which is the strongest value proposition for a mobile car-detailing service aimed at busy professionals?","options":["We are passionate about cars and promise to work hard every day.","The best detailing company with amazing service and great prices for everyone.","Professional interior and exterior detailing at your workplace, so you get a clean car without giving up your evening or weekend.","We use premium products, social media, and several service packages to create a modern company."],"correct":2,"feedbackGood":"Correct. It names a clear customer benefit—saving time—along with how the service delivers it.","feedbackBad":"Look for a specific customer benefit and a clear reason to choose the offer."},
          {"n":8,"title":"The Marketing Mix: 4 Ps","subtitle":"Match the decision to Product, Price, Place, or Promotion.","lesson":"The 4 Ps are Product, Price, Place, and Promotion. Product is what is offered. Price is what customers give up financially and the pricing approach. Place is how and where the offer reaches customers. Promotion is how the business communicates and persuades.","callout":"Product = offer. Price = money/terms. Place = access/distribution. Promotion = communication.","type":"matching","prompt":"Match each marketing decision to the correct P.","pairs":[{"term":"Add a sugar-free flavor and a 24-ounce size","key":"product","definition":"Product"},{"term":"Charge $6.50 and offer a monthly subscription","key":"price","definition":"Price"},{"term":"Sell through a food truck near athletic events","key":"place","definition":"Place"},{"term":"Run short-form videos featuring local athletes","key":"promotion","definition":"Promotion"}]},
          {"n":9,"title":"Put Marketing Thinking in Order","subtitle":"Sequence a simple customer-first marketing process.","lesson":"Effective marketing usually starts with understanding the customer and opportunity. Then the marketer develops a value proposition, builds the marketing mix, launches, and uses results to improve.","callout":"Customer understanding comes before the 4 Ps—not after them.","type":"sorting","prompt":"Put these steps in the most logical order."},
          {"n":10,"title":"Product Decisions","subtitle":"Choose product features that fit the target market.","lesson":"Product decisions include features, quality, design, packaging, services, warranties, sizes, and the total experience. The strongest feature is not always the most expensive—it is the one that creates relevant customer value.","callout":"Product decisions should be driven by the target customer's priorities.","type":"scenario","prompt":"A backpack brand targets students who commute by bicycle in rainy weather. It can afford to add only one feature. Which addition best fits the target market?","options":["A waterproof outer shell and protected laptop compartment.","A celebrity signature printed inside every backpack.","A larger cardboard package that looks impressive on store shelves.","Ten decorative zipper colors that increase production complexity."],"correct":0,"feedbackGood":"Correct. The feature directly addresses a high-priority problem for the target customer.","feedbackBad":"Choose the feature most closely connected to the target customer's situation."},
          {"n":11,"title":"Price Is a Marketing Signal","subtitle":"Use price strategically rather than automatically choosing low or high.","lesson":"Price affects revenue, customer expectations, positioning, and willingness to buy. Marketers consider costs, competitors, demand, perceived value, and positioning when setting prices.","callout":"A good price must work for the customer and the business.","type":"scenario","prompt":"A new premium sneaker-cleaning service uses pickup, same-day cleaning, protective treatment, and delivery. What is the strongest pricing approach to investigate first?","options":["Charge the lowest price in town because new businesses should always compete on price.","Set a price based only on the cost of cleaning chemicals, because labor and customer value are promotional issues.","Compare costs, competitor prices, and what the target customer values about convenience and same-day service.","Copy the price of the largest national shoe brand because established brands provide the best pricing benchmark."],"correct":2,"feedbackGood":"Correct. Pricing should consider costs, alternatives, and perceived customer value.","feedbackBad":"The strongest answer uses more than one relevant source of evidence."},
          {"n":12,"title":"Place: How Customers Get the Offer","subtitle":"Choose a distribution approach that fits customer behavior.","lesson":"Place is the distribution decision: where, when, and how customers can access or receive the product. Convenience and channel fit can create major value.","callout":"Place asks: How does the offer reach the customer?","type":"matching","prompt":"Match each business with the strongest place/distribution choice.","pairs":[{"term":"Late-night snacks for college students","key":"delivery","definition":"Mobile ordering with dorm delivery"},{"term":"Custom team shirts for school clubs","key":"preorder","definition":"Online preorder with school pickup"},{"term":"Premium handmade furniture","key":"showroom","definition":"Appointment-based showroom plus delivery"},{"term":"Digital exam-prep course","key":"online","definition":"Instant access through an online learning platform"}]},
          {"n":13,"title":"Promotion Tools","subtitle":"Classify common ways marketers communicate.","lesson":"Promotion can include advertising, public relations, sales promotion, personal selling, direct marketing, influencer or creator partnerships, events, and digital content. Different tools serve different goals.","callout":"Promotion is the communication part of the marketing mix—not the entire marketing process.","type":"matching","prompt":"Match each example to the promotional tool it best represents.","pairs":[{"term":"A paid 15-second TikTok ad","key":"ad","definition":"Advertising"},{"term":"A limited-time buy-one-get-one offer","key":"salespromo","definition":"Sales Promotion"},{"term":"A local news story about a company's charity event","key":"pr","definition":"Public Relations"},{"term":"A salesperson demonstrates software to a business client","key":"selling","definition":"Personal Selling"}]},
          {"n":14,"title":"Match the 4 Ps to a Launch","subtitle":"Apply the whole mix to one realistic product.","lesson":"The 4 Ps should reinforce one another. A premium product with premium pricing, convenient access for its target audience, and promotion that communicates the same value creates a more coherent strategy.","callout":"The marketing mix works as a system. One P can strengthen—or contradict—the others.","type":"matching","prompt":"A company is launching a premium protein smoothie for high school and club athletes. Match each decision to the correct P.","pairs":[{"term":"30g protein, recovery-focused flavors, resealable bottle","key":"product","definition":"Product"},{"term":"$6.99 with a 5-pack discount","key":"price","definition":"Price"},{"term":"Available at gyms, tournaments, and mobile preorder","key":"place","definition":"Place"},{"term":"Athlete testimonials and tournament sampling","key":"promotion","definition":"Promotion"}]},
          {"n":15,"title":"Branding","subtitle":"Recognize what a brand really represents.","lesson":"A brand is more than a logo. It is the set of meanings, expectations, associations, experiences, and signals customers connect with a company or offer. Brand identity is what the company presents; brand image is what customers actually perceive.","callout":"Logo = identifier. Brand = accumulated meaning and expectation.","type":"scenario","prompt":"A restaurant changes its logo but keeps slow service, inconsistent food, and rude customer interactions. What is most likely true?","options":["The rebrand will fix the brand because customers mainly judge brands by visual identity.","The new logo may change brand identity, but customer experience will continue shaping brand image.","Branding no longer matters because restaurant customers care only about food prices.","The business has changed its target market automatically because a logo redesign creates new customer segments."],"correct":1,"feedbackGood":"Correct. A visual change cannot erase the experience customers repeatedly receive.","feedbackBad":"Separate visual identity from the broader customer perception of the brand."},
          {"n":16,"title":"Competition and Alternatives","subtitle":"Identify what customers compare you against.","lesson":"Competition includes direct competitors offering similar solutions and indirect alternatives that satisfy the same need differently. Customers can also choose to do nothing.","callout":"Your competitor is whatever the customer might choose instead.","type":"scenario","prompt":"A new after-school tutoring service helps students prepare for the SAT. Which is an indirect competitor?","options":["Another local SAT tutoring company with similar weekly sessions.","A national SAT tutoring franchise operating in the same town.","A free collection of online practice videos and self-study materials.","A second tutor who charges a different hourly rate for SAT preparation."],"correct":2,"feedbackGood":"Correct. Self-study solves the same customer job in a different way.","feedbackBad":"Look for an alternative that satisfies the same need through a different type of solution."},
          {"n":17,"title":"Differentiation","subtitle":"Create a meaningful reason to choose.","lesson":"Differentiation means creating a meaningful distinction customers value. A difference matters only when the target customer notices it and cares about it.","callout":"Different is not automatically better. Meaningful difference creates value.","type":"scenario","prompt":"Four lawn-care companies offer similar mowing. Which differentiation is strongest for homeowners who work long hours and hate coordinating service?","options":["Use a brighter green logo than competitors.","Offer text-based scheduling, automatic recurring visits, photo confirmation, and online payment.","Post more motivational quotes on the company's social media accounts.","Buy more expensive mowers even if customers never notice a service difference."],"correct":1,"feedbackGood":"Correct. It differentiates around convenience and reduced coordination—benefits the target customer values.","feedbackBad":"Choose the difference that solves something important for the target customer."},
          {"n":18,"title":"Customer Experience","subtitle":"Understand that marketing continues after the sale.","lesson":"Customer experience includes interactions before, during, and after purchase. Marketers study the customer journey to reduce friction and strengthen satisfaction, loyalty, and word of mouth.","callout":"Marketing does not end when the customer pays.","type":"scenario","prompt":"Which action is most clearly a post-purchase marketing decision?","options":["Choosing a target segment before developing the product.","Sending setup help, checking satisfaction, and making returns easy after a purchase.","Selecting a retail location based on customer traffic patterns.","Testing three advertising headlines before a campaign launches."],"correct":1,"feedbackGood":"Correct. Post-purchase support is part of the customer experience and can influence loyalty and word of mouth.","feedbackBad":"Look for the action that happens after the customer has purchased."},
          {"n":19,"title":"Marketing Ethics","subtitle":"Choose the response that protects trust while still competing.","lesson":"Ethical marketing avoids deception, hidden material information, fake scarcity, misleading claims, and manipulative use of customer data. Legal does not always mean wise; trust is a long-term business asset.","callout":"Ask not only 'Can we do this?' but also 'Would customers consider this fair and transparent?'","type":"scenario","prompt":"A fitness app knows from internal testing that its 'Lose 10 pounds in 10 days' ad is unrealistic for most users, but the claim dramatically improves clicks. What should the company do?","options":["Keep the claim because customers are responsible for researching whether advertisements are realistic.","Use the claim only on social media, where audiences expect exaggerated promotional language.","Replace it with an evidence-based claim that accurately communicates likely results and conditions.","Keep the claim until a regulator specifically orders the company to stop using it."],"correct":2,"feedbackGood":"Correct. Ethical promotion should communicate material performance claims accurately rather than exploit a misleading promise.","feedbackBad":"Consider customer trust and whether the performance claim is supported by evidence."},
          {"n":20,"title":"Launch Day: Make the Marketing Decision","subtitle":"Pull customer, value, and the 4 Ps together.","lesson":"Strong marketing decisions fit together around a clearly defined customer and value proposition. The best launch is not the one with the most features or loudest advertising—it is the one whose decisions reinforce the customer problem and desired value.","callout":"Final test: Customer → Value Proposition → Marketing Mix → Evidence.","type":"scenario","prompt":"A team wants to launch a $10 smoothie near a high school. Research shows most students will pay $5–$7, athletes want high protein after practice, and the busiest demand occurs from 2:45–4:30. Which launch plan is strongest?","options":["Keep the $10 price, sell all day, target every student, and spend most of the budget on a dramatic launch video.","Offer a $6.50 high-protein smoothie, focus on after-school athletes, sell near practices from 2:45–4:30, and promote recovery and convenience.","Offer a $4 basic smoothie to everyone, remove the protein benefit to reduce cost, and rely on word of mouth instead of communicating a target benefit.","Keep the premium $10 product but add more flavors and a loyalty card before testing whether students value the original offer."],"correct":1,"feedbackGood":"Correct. The plan aligns target customer, customer evidence, value proposition, price, place, and promotion.","feedbackBad":"Choose the plan that uses the research and makes the 4 Ps reinforce the target customer's needs."}
          ]
          qjson = json.dumps(QUESTIONS, ensure_ascii=False, separators=(',', ':'))
          text = re.sub(r'const QUESTIONS = \[.*?\];\n\nfunction sectionHTML', 'const QUESTIONS = '+qjson+';\n\nfunction sectionHTML', text, count=1, flags=re.S)

          replacements = {
            '<title>Financial Planning & Goal Setting | Vivid Lessons</title>':'<title>Basics of Marketing | Vivid Lessons</title>',
            'Personal Finance Module':'Marketing Module',
            'Financial Planning & Goal Setting <span class="gradient">Interactive Lesson.</span>':'Basics of Marketing <span class="gradient">Interactive Lesson.</span>',
            'Students learn how to set realistic financial goals, calculate goal progress, compare opportunity costs, and make stronger long-term decisions about education, lifestyle, family, transportation, and savings.':'Students learn how marketers identify customers, create value, segment markets, build the 4 Ps, differentiate brands, evaluate competition, shape customer experience, and make ethical decisions.',
            '<span class="meta-pill">Calculator</span>':'<span class="meta-pill">Customer Strategy</span>',
            'Financial Planning & Goal Setting</strong>.':'Basics of Marketing</strong>.',
            'Strong financial learning means explaining the idea and connecting it to a real-life decision.':'Strong marketing learning means explaining the idea and connecting it to a real customer or business decision.',
            'Explain one thing you learned about financial planning or goal setting, and describe one real-world goal where opportunity cost could matter.':'Think about one business or brand you interact with regularly. What is one thing you learned in this module that helps explain why its marketing works—or does not work? Use at least one specific example.',
            'Choose action steps and a savings amount':'Build the Product, Price, Place, and Promotion decisions',
            'Define the goal clearly':'Identify the customer and the problem, need, or want',
            'Track progress and adjust when needed':'Launch, measure customer response, and adjust',
            'Estimate cost, timeline, and opportunity cost':'Develop the value proposition and reason to choose',
            'Correct. Define, estimate, act, then track.':'Correct. Identify the customer, develop the value proposition, build the mix, then measure.',
            'Review the planning sequence and rearrange it.':'Review the customer-first marketing sequence and rearrange it.',
            'Start by defining the goal, then estimate costs and alternatives before choosing actions.':'Start with the customer and opportunity, then develop value before building the marketing mix.',
            'Module Version 3.5':'Marketing Basics • Version 1.0'
          }
          for a,b in replacements.items():
            text = text.replace(a,b)

          # Remove calculator from metadata type list if any old visible copy remains.
          text = text.replace('"Calculator"],','"Sorting"],')
          dst.write_text(text, encoding='utf-8')
          PY
      - name: Commit generated module
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/marketing-basics-intro-mrd.html
          git diff --cached --quiet || git commit -m "Add Basics of Marketing interactive module"
          git push
