<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Financial Planning & Goal Setting | Vivid Lessons</title><style>html,body{margin:0;min-height:100%;background:#F8FAFC;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#0D1B2A;font-weight:700}.error{max-width:760px;margin:80px auto;padding:24px;background:white;border:1px solid #e2e8f0;border-radius:18px;color:#991b1b}</style></head><body><div class="loading" id="status">Loading Vivid Lessons module…</div><script>
(async function(){
const sourceUrl="https://vividlessons.com/modules/pfm-financial-planning-goal-setting.html";
const newEndpoint="https://script.google.com/macros/s/AKfycbxVlFk0h_txjaAaTsMVuaWqqSWHLHK-tfl9_KDWDIbUjbPqdR_vu3Vs1AQy8vfmEd8/exec";
const replacement="const QUESTIONS = [{\"n\":1,\"title\":\"What Makes a Goal Financial?\",\"subtitle\":\"Identify the feature that turns a general goal into a financial goal.\",\"lesson\":\"A financial goal is a money-related outcome you plan to reach. It usually includes a dollar amount, a financial behavior such as saving or paying down debt, or a money consequence that must be managed.\",\"callout\":\"Definition: Financial goal = a specific money-related result you intend to reach.\",\"type\":\"multiple-choice\",\"prompt\":\"Which statement is most clearly a financial goal rather than just a general life goal?\",\"options\":[\"I want to be more independent after graduation and have enough flexibility to choose where I live.\",\"I plan to move out once I feel ready and my schedule allows it.\",\"Build a $1,000 emergency fund before moving out.\",\"I want a job that gives me more freedom and better hours.\"],\"correct\":2,\"feedbackGood\":\"Correct. It names a specific money target that can be planned and measured.\",\"feedbackBad\":\"Look for the choice with a measurable money result, not just a general intention.\"},{\"n\":2,\"title\":\"Short-, Intermediate-, and Long-Term Goals\",\"subtitle\":\"Use the expected timeline to classify a goal.\",\"lesson\":\"Short-term goals are usually reached within about a year. Intermediate goals often take roughly one to five years. Long-term goals commonly take more than five years. The exact cutoffs can vary, but the purpose is to match the plan to the amount of time available.\",\"callout\":\"Definitions: short-term = about a year or less; intermediate = roughly 1–5 years; long-term = usually more than 5 years.\",\"type\":\"multiple-choice\",\"prompt\":\"Which goal is best classified as an intermediate financial goal?\",\"options\":[\"Save $600 for a spring trip in six months by setting aside part of each paycheck.\",\"Build a down payment fund over the next three years.\",\"Start investing for retirement at age 18 and continue contributing throughout adulthood.\",\"Set aside enough money for next week's school event without borrowing.\"],\"correct\":1,\"feedbackGood\":\"Correct. A three-year target fits the intermediate range.\",\"feedbackBad\":\"Use the timeline definitions above. Look for a goal that is longer than about a year but not typically a many-year or decades-long goal.\"},{\"n\":3,\"title\":\"SMART Goals\",\"subtitle\":\"Distinguish a complete SMART goal from one that only sounds specific.\",\"lesson\":\"SMART stands for Specific, Measurable, Achievable, Relevant, and Time-bound. A strong SMART goal states what will happen, how progress can be measured, whether the target is realistic, why it matters, and when it should be completed.\",\"callout\":\"Definitions: Specific = clear target; Measurable = trackable amount; Achievable = realistic; Relevant = connected to your priorities; Time-bound = deadline.\",\"type\":\"multiple-choice\",\"prompt\":\"Which goal is the strongest SMART goal?\",\"options\":[\"I will save more this semester and check my balance every month so I become more responsible with money.\",\"I will save $45 from each paycheck for a certification fee and increase it when I can.\",\"Save $360 by December 15 by transferring $45 from each of my next eight paychecks for a required certification fee.\",\"I will avoid unnecessary spending, track every purchase, and try to reach about $360 before winter break.\"],\"correct\":2,\"feedbackGood\":\"Correct. It includes a clear amount, action, deadline, realistic structure, and purpose.\",\"feedbackBad\":\"Several choices sound responsible. Choose the one that clearly satisfies all five SMART elements.\"},{\"n\":4,\"title\":\"Opportunity Cost\",\"subtitle\":\"Identify what is actually given up when one option is chosen.\",\"lesson\":\"Opportunity cost is the value of the next-best alternative you give up when you make a choice. It is not every possible alternative and it is not automatically the price of the option you chose.\",\"callout\":\"Definition: Opportunity cost = the next-best alternative sacrificed by a decision.\",\"type\":\"scenario\",\"prompt\":\"Jada has $300. Her next-best alternative to upgrading her phone is putting the $300 toward a car down payment. If she buys the phone, what is her opportunity cost?\",\"options\":[\"The $300 purchase price of the phone plus any taxes or activation fees she pays at checkout.\",\"The car-fund progress she gives up.\",\"Any future repair or replacement costs the new phone might create over time.\",\"The difference between the resale value of her old phone and the price of the new phone.\"],\"correct\":1,\"feedbackGood\":\"Correct. The opportunity cost is the next-best alternative she gives up: progress on the car fund.\",\"feedbackBad\":\"Do not confuse price with opportunity cost. Identify the next-best alternative that is sacrificed.\"},{\"n\":5,\"title\":\"Trade-Offs\",\"subtitle\":\"Recognize a trade-off when both options have benefits and costs.\",\"lesson\":\"A trade-off is the comparison between benefits and costs when choosing among alternatives. Unlike opportunity cost, which focuses on the next-best option given up, a trade-off looks more broadly at what you gain and lose across choices.\",\"callout\":\"Definitions: Trade-off = benefits and costs compared across choices. Opportunity cost = next-best alternative given up.\",\"type\":\"scenario\",\"prompt\":\"Luis can work 18 hours this week and earn more money, or work 10 hours and use the extra time to prepare for an exam. Which statement best describes the trade-off?\",\"options\":[\"Working 18 hours is financially better because the extra income can always be used toward future goals.\",\"Working fewer hours has no financial effect because studying does not directly remove money from his account.\",\"Compare the extra pay with the value of more study time.\",\"His opportunity cost is the total amount of every paycheck he could earn during the rest of the school year.\"],\"correct\":2,\"feedbackGood\":\"Correct. A trade-off compares the benefits and costs on both sides of the decision.\",\"feedbackBad\":\"The best answer should compare what is gained and what is sacrificed rather than treating one factor as automatically decisive.\"},{\"n\":6,\"title\":\"A Financial Decision Process\",\"subtitle\":\"Choose the strongest next step when multiple options could work.\",\"lesson\":\"A useful decision process is: define the goal, gather relevant information, identify realistic options, compare costs and benefits, choose, and then review the result. Good decisions often require more than one useful fact.\",\"callout\":\"Key idea: define the goal before comparing options; compare options before committing.\",\"type\":\"scenario\",\"prompt\":\"Noah is deciding between community college, a trade program, and full-time work. He already knows his career goal. What should he do next?\",\"options\":[\"Choose the option with the lowest upfront price because reducing cost should come before every other factor.\",\"Compare cost, time, likely earnings, and goal fit.\",\"Ask several friends which path they would choose, then use the most common answer as a starting point.\",\"Pick the path that starts soonest so he does not lose time while continuing to research the others.\"],\"correct\":1,\"feedbackGood\":\"Correct. Once the goal is defined, the next step is to gather and compare relevant information.\",\"feedbackBad\":\"A single factor can matter, but the stronger process compares several relevant factors tied to the goal.\"},{\"n\":7,\"title\":\"Match the Planning Terms\",\"subtitle\":\"Match each term to the definition taught above.\",\"lesson\":\"Financial planning uses several related terms. A financial goal is the money result you want. Opportunity cost is the next-best alternative you give up. A trade-off compares benefits and costs across choices. An action step is a specific behavior that moves the plan forward.\",\"callout\":\"Definitions are provided here because the task is to apply and distinguish the terms—not guess unfamiliar vocabulary.\",\"type\":\"matching\",\"prompt\":\"Match each planning term to its best definition.\",\"pairs\":[{\"term\":\"Financial Goal\",\"key\":\"goal\",\"definition\":\"A specific money-related result you intend to reach\"},{\"term\":\"Opportunity Cost\",\"key\":\"opp\",\"definition\":\"The next-best alternative given up when a choice is made\"},{\"term\":\"Trade-Off\",\"key\":\"trade\",\"definition\":\"A comparison of benefits and costs across alternatives\"},{\"term\":\"Action Step\",\"key\":\"action\",\"definition\":\"A specific behavior that moves a plan forward\"}]},{\"n\":8,\"title\":\"Match the SMART Components\",\"subtitle\":\"Apply the SMART definitions to parts of a goal.\",\"lesson\":\"SMART goals are Specific, Measurable, Achievable, Relevant, and Time-bound. Different parts of one goal can satisfy different SMART components.\",\"callout\":\"Use these definitions: Specific = exactly what; Measurable = amount/progress; Relevant = why it matters; Time-bound = deadline.\",\"type\":\"matching\",\"prompt\":\"Match each SMART component to the detail that best demonstrates it.\",\"pairs\":[{\"term\":\"Specific\",\"key\":\"specific\",\"definition\":\"Save for a state licensing exam fee\"},{\"term\":\"Measurable\",\"key\":\"measure\",\"definition\":\"Reach a total of $480\"},{\"term\":\"Relevant\",\"key\":\"relevant\",\"definition\":\"The license is required for the student's planned career\"},{\"term\":\"Time-bound\",\"key\":\"time\",\"definition\":\"Complete the savings goal by November 30\"}]},{\"n\":9,\"title\":\"Put the Planning Steps in Order\",\"subtitle\":\"Sequence the planning process logically.\",\"lesson\":\"A goal plan works best when the steps follow a useful sequence: define the goal, estimate the financial requirements and alternatives, choose actions, and then track and adjust.\",\"callout\":\"Order matters because you cannot evaluate progress until the goal and plan are clear.\",\"type\":\"sorting\",\"prompt\":\"Put the goal-planning steps in the most logical order.\"},{\"n\":10,\"title\":\"Calculate the Savings Target\",\"subtitle\":\"Turn a total goal into a monthly amount.\",\"lesson\":\"When the same amount will be saved each month, divide the total amount still needed by the number of months available.\",\"callout\":\"Formula: monthly savings needed = amount still needed ÷ months remaining.\",\"type\":\"calculator\",\"prompt\":\"Ava still needs $1,200 for used-car expenses and has 8 months left. How much should she save per month? Enter the number only.\",\"correctValue\":150},{\"n\":11,\"title\":\"Compare Two Training Options\",\"subtitle\":\"Choose the most useful comparison rather than the cheapest or fastest option automatically.\",\"lesson\":\"Cost matters, but it should be evaluated with timeline, risk, likely benefit, and fit with the goal. A higher-cost option can sometimes create more value; a lower-cost option can sometimes be the better fit.\",\"callout\":\"Key idea: the strongest decision uses relevant evidence, not one automatic rule.\",\"type\":\"scenario\",\"prompt\":\"Marcus wants job training that could raise his earnings within one year. Option A costs $800 and takes 3 months. Option B costs $2,100 and takes 7 months but reports stronger job placement. What information would be most useful before deciding?\",\"options\":[\"Whether Option A lets him finish four months earlier and begin earning sooner than Option B.\",\"Compare net cost, verified outcomes, and employer acceptance.\",\"Whether Option B has newer facilities, more course choices, and a schedule that feels more flexible.\",\"The average salary of all workers in the industry, even if the data does not separate people by credential.\"],\"correct\":1,\"feedbackGood\":\"Correct. That evidence compares actual cost, outcomes, and goal fit rather than relying on a single attractive feature.\",\"feedbackBad\":\"Several facts could matter, but choose the information that best compares cost, outcomes, and fit with Marcus's stated goal.\"},{\"n\":12,\"title\":\"A Real Spending Trade-Off\",\"subtitle\":\"Balance a current want with a future goal.\",\"lesson\":\"Good planning does not require eliminating every current want. It requires understanding how today's choice affects the goal, then deciding whether the trade-off fits your priorities and timeline.\",\"callout\":\"A balanced plan can include wants, but the effect on the goal should be calculated rather than ignored.\",\"type\":\"scenario\",\"prompt\":\"Lena has $620 saved toward a $900 certification goal due in four months. She wants to spend $180 on a weekend trip. Which response shows the strongest planning?\",\"options\":[\"Skip the trip because spending on wants is always a bad financial decision when a deadline is approaching.\",\"Take the trip, then increase later savings only if she happens to have extra money left after other spending.\",\"Calculate the new monthly amount needed, then decide if the trip still fits.\",\"Use a credit card for the trip so her current savings balance does not decrease, then pay the card later.\"],\"correct\":2,\"feedbackGood\":\"Correct. She measures the effect on the goal before deciding instead of using a rigid rule or hiding the cost.\",\"feedbackBad\":\"The strongest answer makes the trade-off measurable and keeps the future goal in the decision.\"},{\"n\":13,\"title\":\"Match Goals to Their Time Horizon\",\"subtitle\":\"Classify realistic goals using the timeline definitions.\",\"lesson\":\"Short-term goals are usually about a year or less, intermediate goals often span one to five years, and long-term goals generally extend beyond five years.\",\"callout\":\"Use the time horizon—not how important the goal sounds—to classify it.\",\"type\":\"matching\",\"prompt\":\"Match each goal to the best time-horizon label.\",\"pairs\":[{\"term\":\"Replace a broken laptop in 7 months\",\"key\":\"short\",\"definition\":\"Short-term goal\"},{\"term\":\"Build a car down payment over 30 months\",\"key\":\"intermediate\",\"definition\":\"Intermediate goal\"},{\"term\":\"Save for retirement over several decades\",\"key\":\"long\",\"definition\":\"Long-term goal\"},{\"term\":\"Pay an annual insurance bill due in 10 months\",\"key\":\"short2\",\"definition\":\"Short-term goal\"}]},{\"n\":14,\"title\":\"Match Decision Factors to Evidence\",\"subtitle\":\"Recognize what kind of evidence each fact provides.\",\"lesson\":\"A decision can be compared using several factors: cost is the money required, timeline is how long it takes, risk is the chance of an unfavorable result, and benefit is the value or improvement expected.\",\"callout\":\"Definitions: cost = money required; timeline = time required; risk = uncertainty/downside; benefit = expected gain.\",\"type\":\"matching\",\"prompt\":\"Match each decision factor to the evidence that best represents it.\",\"pairs\":[{\"term\":\"Cost\",\"key\":\"cost\",\"definition\":\"The program requires $1,450 after grants\"},{\"term\":\"Timeline\",\"key\":\"timeline\",\"definition\":\"The credential takes 14 months to complete\"},{\"term\":\"Risk\",\"key\":\"risk\",\"definition\":\"Completion rates vary widely and the deposit is nonrefundable\"},{\"term\":\"Benefit\",\"key\":\"benefit\",\"definition\":\"Graduates in the target occupation report higher starting pay\"}]},{\"n\":15,\"title\":\"Repair a Weak Goal\",\"subtitle\":\"Identify the revision that fixes the most important weaknesses.\",\"lesson\":\"A weak goal often lacks a measurable target, a deadline, or an action step. A stronger revision should improve those missing pieces without adding unrealistic detail.\",\"callout\":\"Strong goals can be checked later because the target and timeline are clear.\",\"type\":\"multiple-choice\",\"prompt\":\"A student writes, “I want to save for life after high school.” Which revision is strongest?\",\"options\":[\"Save $600 by graduation by transferring $30 from each of my next 20 paychecks.\",\"I will save as much as possible before graduation and avoid most optional spending until I feel prepared.\",\"I will try to keep at least $600 in savings once senior year begins, even if the balance changes during the year.\",\"I will put $30 into savings on paydays and decide on a final target after I see how much I can afford.\"],\"correct\":0,\"feedbackGood\":\"Correct. It adds a measurable target, deadline, and repeatable action.\",\"feedbackBad\":\"The strongest revision fixes the vague amount, timeline, and action rather than improving only one or two of those pieces.\"},{\"n\":16,\"title\":\"Match the Missing Goal Component\",\"subtitle\":\"Diagnose what is missing from an otherwise reasonable goal.\",\"lesson\":\"A useful goal should make the target, amount or progress measure, timeline, and action understandable. A goal can sound responsible and still be incomplete.\",\"callout\":\"Diagnose the missing component rather than judging whether the goal itself is good or bad.\",\"type\":\"matching\",\"prompt\":\"Match each goal statement to the component it most clearly lacks.\",\"pairs\":[{\"term\":\"“I will save $500 for emergency expenses by December.”\",\"key\":\"action\",\"definition\":\"A clear action step describing how the money will be saved\"},{\"term\":\"“I will save $40 from each paycheck for a certification.”\",\"key\":\"deadline\",\"definition\":\"A deadline or completion date\"},{\"term\":\"“I will save for a laptop by October by moving money each payday.”\",\"key\":\"amount\",\"definition\":\"A measurable dollar target\"},{\"term\":\"“I will save $300 by June by transferring $25 per paycheck.”\",\"key\":\"purpose\",\"definition\":\"A stated purpose or relevant reason for the goal\"}]},{\"n\":17,\"title\":\"Opportunity Cost in a Real Choice\",\"subtitle\":\"Separate the chosen option from the alternative sacrificed.\",\"lesson\":\"Opportunity cost depends on the next-best alternative for that person. Two students making the same purchase can have different opportunity costs if the alternative they would otherwise choose is different.\",\"callout\":\"The opportunity cost is personal to the alternatives actually being considered.\",\"type\":\"scenario\",\"prompt\":\"Maya has $450. Her first choice is a used laptop for school. Her next-best option is keeping the money in an emergency fund. If she buys the laptop, what is the opportunity cost?\",\"options\":[\"The emergency-fund security she gives up.\",\"The $450 sticker price of the laptop plus any sales tax or accessories she chooses to buy.\",\"Any repairs, battery replacement, or software costs the laptop might need later.\",\"The schoolwork and convenience she gains by having a laptop available whenever she needs it.\"],\"correct\":0,\"feedbackGood\":\"Correct. The emergency fund is the next-best alternative she sacrifices.\",\"feedbackBad\":\"Identify the next-best alternative she would have chosen if she did not buy the laptop.\"},{\"n\":18,\"title\":\"When the Cheapest Option Is Not Automatically Best\",\"subtitle\":\"Apply goal fit, total cost, and risk together.\",\"lesson\":\"Price is one part of a financial decision. Total cost can include fees, maintenance, financing, lost time, and risk. A cheaper upfront option can be more expensive overall, while a higher upfront option is not automatically better either.\",\"callout\":\"Avoid the shortcut “lowest price = best choice.” Compare total impact.\",\"type\":\"multiple-choice\",\"prompt\":\"Two used cars meet Priya's transportation needs. Car A costs $1,100 less upfront but needs tires soon and has no service records. Car B costs more but has documented maintenance and newer tires. What is the strongest conclusion?\",\"options\":[\"Car A is better because paying less upfront always leaves more money available for insurance, fuel, or other goals.\",\"Car B is better because documented maintenance and newer tires guarantee that it will cost less to own.\",\"Compare near-term costs, reliability evidence, insurance, and budget fit.\",\"The cars are financially equal because both meet the transportation need, so the lower sticker price should decide it.\"],\"correct\":2,\"feedbackGood\":\"Correct. The evidence is mixed, so the best decision compares total cost and risk rather than using one shortcut.\",\"feedbackBad\":\"Beware of absolute claims. The information given supports a comparison, not an automatic winner.\"},{\"n\":19,\"title\":\"Match Actions to Likely Consequences\",\"subtitle\":\"Connect planning behaviors to realistic outcomes.\",\"lesson\":\"Action steps have consequences. Automatic transfers can improve consistency, extending a deadline can reduce the amount needed each month, borrowing can create interest costs, and tracking progress can reveal when a plan needs adjustment.\",\"callout\":\"The task is not to label actions as simply good or bad; match each action to its most likely financial effect.\",\"type\":\"matching\",\"prompt\":\"Match each action to the most likely consequence.\",\"pairs\":[{\"term\":\"Set an automatic transfer each payday\",\"key\":\"auto\",\"definition\":\"Makes saving more consistent without relying on remembering each time\"},{\"term\":\"Extend a savings deadline by four months\",\"key\":\"extend\",\"definition\":\"Can reduce the amount that must be saved each month\"},{\"term\":\"Borrow to cover a goal immediately\",\"key\":\"borrow\",\"definition\":\"May add interest and required future payments\"},{\"term\":\"Review progress every month\",\"key\":\"review\",\"definition\":\"Makes it easier to spot a shortfall and adjust the plan\"}]},{\"n\":20,\"title\":\"Final Application: Choose the Stronger Plan\",\"subtitle\":\"Use the full planning process on a realistic goal.\",\"lesson\":\"A strong financial plan connects a relevant goal with a measurable target, realistic timeline, action steps, and awareness of trade-offs. Strong plans can also be adjusted when new information appears.\",\"callout\":\"Final check: goal + amount + timeline + action + trade-off awareness.\",\"type\":\"scenario\",\"prompt\":\"A student needs $450 for a professional certification exam in six months and currently has $90 saved. Which plan is strongest?\",\"options\":[\"Save $60 per month, keep the exam money separate, and review the plan if the fee or income changes.\",\"Save $75 in months when spending is low, then reduce saving in expensive months so the plan stays flexible.\",\"Use the current $90 for other expenses and replace it later because six months provides enough time to catch up.\",\"Save the remaining $360 over six months but keep it in checking so it can also cover other important expenses if needed.\"],\"correct\":0,\"feedbackGood\":\"Correct. The plan covers the remaining $360 with a measurable action, protects the goal money, and allows adjustment if conditions change.\",\"feedbackBad\":\"Several choices contain reasonable ideas. Choose the plan that fully covers the remaining amount while protecting the goal and allowing review.\"}];\nlet started=false,startTime=null,finishTime=null,score=0,total=MODULE_META.questionCount,completedSections=0,answers={},questionTypes=[];\nlet completionLocked=false;\n\nfunction shuffleArray(array){\n  const copy=[...array];\n  for(let i=copy.length-1;i>0;i--){\n    const j=Math.floor(Math.random()*(i+1));\n    [copy[i],copy[j]]=[copy[j],copy[i]];\n  }\n  return copy;\n}\n\nfunction safeInlineText(text){\n  return String(text).replace(/\\\\/g,\"\\\\\\\\\").replace(/'/g,\"&apos;\").replace(/\\n/g,\" \");\n}\n\nfunction renderRandomizedOptions(q){\n  const randomized=shuffleArray(q.options.map((optionText,index)=>({\n    text:optionText,\n    correct:index===q.correct,\n    feedback:index===q.correct?q.feedbackGood:q.feedbackBad\n  })));\n  return randomized.map(choice=>`\n    <button class=\"option\" onclick=\"mc(this,${q.n},${choice.correct},'${safeInlineText(choice.feedback)}')\">\n      ${choice.text}\n    </button>\n  `).join(\"\");\n}\n\nfunction renderMatching(q){\n  return `<div class=\"match-grid\">${q.pairs.map((pair,index)=>{\n    const choices=shuffleArray(q.pairs).map(choice=>`<option value=\"${choice.key}\">${choice.definition}</option>`).join(\"\");\n    return `<div class=\"match-row\"><strong>${pair.term}</strong><select id=\"m${q.n}_${index}\"><option value=\"\">Choose the best match</option>${choices}</select></div>`;\n  }).join(\"\")}</div><button class=\"btn btn-primary\" style=\"margin-top:14px\" onclick=\"checkMatching(${q.n})\">Check Matching</button><div class=\"feedback\" id=\"fb${q.n}\"></div>`;\n}\n\nfunction sectionHTML(q){\n  let inner=\"\";\n  if(q.type===\"matching\"){\n    inner=renderMatching(q);\n  }else if(q.type===\"sorting\"){\n    inner=`<div class=\"sort-list\" id=\"sortList\"><div class=\"sort-item\" data-step=\"3\">Choose action steps and a savings amount<span class=\"sort-controls\"><button onclick=\"move(this,-1)\">↑</button><button onclick=\"move(this,1)\">↓</button></span></div><div class=\"sort-item\" data-step=\"1\">Define the goal clearly<span class=\"sort-controls\"><button onclick=\"move(this,-1)\">↑</button><button onclick=\"move(this,1)\">↓</button></span></div><div class=\"sort-item\" data-step=\"4\">Track progress and adjust when needed<span class=\"sort-controls\"><button onclick=\"move(this,-1)\">↑</button><button onclick=\"move(this,1)\">↓</button></span></div><div class=\"sort-item\" data-step=\"2\">Estimate cost, timeline, and opportunity cost<span class=\"sort-controls\"><button onclick=\"move(this,-1)\">↑</button><button onclick=\"move(this,1)\">↓</button></span></div></div><button class=\"btn btn-primary\" style=\"margin-top:14px\" onclick=\"checkSort()\">Check Order</button><div class=\"feedback\" id=\"fb${q.n}\"></div>`;\n  }else if(q.type===\"calculator\"){\n    inner=`<div class=\"numeric-box\"><div><label>Enter dollars per month</label><input id=\"calcAnswer\" type=\"number\" placeholder=\"Example: 150\"></div><button class=\"btn btn-primary\" onclick=\"checkNumeric(${q.n})\">Check Answer</button></div><div class=\"feedback\" id=\"fb${q.n}\"></div>`;\n  }else{\n    inner=`<div class=\"options\">${renderRandomizedOptions(q)}</div><div class=\"feedback\" id=\"fb${q.n}\"></div>`;\n  }\n  return `<section class=\"section locked\" id=\"sec${q.n}\"><div class=\"section-head\"><div class=\"section-title\"><h2>${q.n}. ${q.title}</h2><p>${q.subtitle}</p></div><span class=\"badge lock\" id=\"badge${q.n}\">Locked</span></div><div class=\"section-body\"><div class=\"lock-msg\">${q.n===1?\"Complete the student start form\":\"Complete Section \"+(q.n-1)} to unlock this section.</div><div class=\"content\"><div class=\"lesson-card\"><h3>Mini Lesson</h3><p>${q.lesson}</p><div class=\"callout\">${q.callout}</div></div><div class=\"activity\" data-question=\"${q.n}\" data-type=\"${q.type}\" data-points=\"1\"><h3>Question ${q.n}${q.type===\"matching\"?\": Matching\":q.type===\"sorting\"?\": Sorting\":q.type===\"calculator\"?\": Calculation\":\"\"}</h3><p>${q.prompt}</p>${inner}</div></div></div></section>`;\n}\n\nfunction render(){\n  document.getElementById(\"moduleSections\").innerHTML = QUESTIONS.map(sectionHTML).join(\"\") + `<section class=\"section locked\" id=\"sec21\"><div class=\"section-head\"><div class=\"section-title\"><h2>21. Reflection and Certificate</h2><p>Reflection is required before the certificate appears.</p></div><span class=\"badge lock\" id=\"badge21\">Locked</span></div><div class=\"section-body\"><div class=\"lock-msg\">Complete Section 20 to unlock this section.</div><div class=\"content\"><div class=\"lesson-card\"><h3>Final Reflection</h3><p>Strong financial learning means explaining the idea and connecting it to a real-life decision.</p></div><div class=\"activity\" data-type=\"reflection\"><h3>Required Reflection</h3><p>Explain one thing you learned about financial planning or goal setting, and describe one real-world goal where opportunity cost could matter.</p><textarea id=\"reflection\" placeholder=\"Write your reflection here...\"></textarea><button class=\"btn btn-primary\" style=\"margin-top:14px\" onclick=\"finishModule()\">Submit Reflection and Generate Certificate</button><div class=\"feedback\" id=\"fb21\"></div></div></div></div></section>`;\n}\nrender();\n\nfunction toast(msg){const t=document.getElementById(\"toast\");t.textContent=msg;t.classList.add(\"show\");setTimeout(()=>t.classList.remove(\"show\"),2400)}\nfunction formatTime(date){return date.toLocaleString([],{month:\"short\",day:\"numeric\",year:\"numeric\",hour:\"numeric\",minute:\"2-digit\"})}\nfunction updateProgress(){const percent=Math.round((completedSections/MODULE_META.sectionCount)*100);document.getElementById(\"bar\").style.width=percent+\"%\";document.getElementById(\"progressText\").textContent=\"Progress: \"+percent+\"%\";document.getElementById(\"scoreText\").textContent=\"Score: \"+score+\" / \"+total;if(startTime)document.getElementById(\"timeText\").textContent=\"Started: \"+formatTime(startTime)}\nfunction unlock(n){const sec=document.getElementById(\"sec\"+n),badge=document.getElementById(\"badge\"+n);sec.classList.remove(\"locked\");badge.className=\"badge\";badge.textContent=\"Unlocked\"}\nfunction completeSection(n){const badge=document.getElementById(\"badge\"+n);badge.className=\"badge done\";badge.textContent=\"Complete\";completedSections=Math.max(completedSections,n);updateProgress();if(n<MODULE_META.sectionCount){unlock(n+1);toast(\"Section \"+(n+1)+\" unlocked. Scroll when ready.\")}}\nfunction startModule(){if(completionLocked){toast(\"This module is already completed. Answers are hidden.\");return}const first=document.getElementById(\"firstName\").value.trim(),last=document.getElementById(\"lastName\").value.trim(),period=document.getElementById(\"classPeriod\").value.trim();if(!first||!last||!period){toast(\"Enter first name, last name, and class period/block.\");return}if(!started){started=true;startTime=new Date(
