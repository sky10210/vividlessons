<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Financial Planning & Goal Setting | Vivid Lessons</title>
<style>html,body{margin:0;min-height:100%;background:#F8FAFC;font-family:Arial,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;color:#0D1B2A;font-weight:700}.error{max-width:760px;margin:80px auto;padding:24px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;color:#991b1b}</style>
</head>
<body>
<div class="loading">Loading Vivid Lessons module…</div>
<script>
(async function(){
  const sourceUrl = "https://vividlessons.com/modules/pfm-financial-planning-goal-setting-mrd.html";
  const oldEndpoint = "https://script.google.com/macros/s/AKfycbxVlFk0h_txjaAaTsMVuaWqqSWHLHK-tfl9_KDWDIbUjbPqdR_vu3Vs1AQy8vfmEd8/exec";
  const newEndpoint = "https://script.google.com/macros/s/AKfycbzwwYHMS2dU1i1FDw3MtzeeSyjJovTACGiagbVVa8xVIkxDtZfPx8oGrMd1q3IDk0D2/exec";
  try {
    const response = await fetch(sourceUrl, {cache:"no-store"});
    if (!response.ok) throw new Error("Could not load module source.");
    let html = await response.text();
    if (!html.includes(oldEndpoint)) throw new Error("Old submission endpoint was not found.");
    html = html.replaceAll(oldEndpoint, newEndpoint);
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.body.innerHTML = '<div class="error"><strong>Module loading error.</strong><br>'+String(err.message || err)+'</div>';
  }
})();
</script>
</body>
</html>
